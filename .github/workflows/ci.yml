name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner OS: $(uname -a)"
          command -v bash >/dev/null
          command -v git >/dev/null
          command -v tar >/dev/null
          command -v curl >/dev/null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Smoke API
        run: npm run smoke:api

      - name: Build
        run: npm run build
