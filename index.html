<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artifact Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app" class="app">
      <aside class="gallery-panel glass" aria-label="Artifact library">
        <p class="panel-label">Collection</p>
        <h1 class="brand-title">Artifact Viewer</h1>
        <p class="brand-subtitle">Museum-grade 3D storytelling in a pure canvas space.</p>
        <label class="search-shell" for="artifactSearchInput">
          <span class="search-label">Search</span>
          <input id="artifactSearchInput" class="search-input" type="search" placeholder="Find by name, material, or story..." autocomplete="off" />
        </label>
        <div id="filterBar" class="filter-bar" role="tablist" aria-label="Artifact categories"></div>
        <div id="galleryList" class="gallery-list" role="listbox" aria-label="Artifacts"></div>
      </aside>

      <main id="stage" class="stage">
        <div id="viewerGrid" class="viewer-grid">
          <section id="primaryPane" class="viewer-pane is-primary" aria-label="Primary artifact viewer">
            <canvas id="viewport" aria-label="Primary 3D object viewer"></canvas>

            <div id="loadingOverlay" class="loading-overlay">
              <p id="loadingText" class="loading-text">Preparing artifact…</p>
              <div class="loading-track" role="progressbar" aria-label="Model loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="loadingBar" class="loading-bar"></div>
              </div>
            </div>

            <div id="hotspotLayer" class="hotspot-layer" aria-hidden="true"></div>
          </section>

          <section id="comparePane" class="viewer-pane compare-pane" aria-label="Comparison artifact viewer" aria-hidden="true">
            <canvas id="viewportCompare" aria-label="Comparison 3D object viewer"></canvas>

            <div id="loadingOverlayCompare" class="loading-overlay">
              <p id="loadingTextCompare" class="loading-text">Preparing comparison artifact…</p>
              <div class="loading-track" role="progressbar" aria-label="Comparison model loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="loadingBarCompare" class="loading-bar"></div>
              </div>
            </div>

            <div id="hotspotLayerCompare" class="hotspot-layer" aria-hidden="true"></div>
            <p id="comparePaneTitle" class="compare-pane-title"></p>
          </section>
        </div>

        <header class="top-bar">
          <p id="artifactTitle" class="artifact-title"></p>
          <div class="controls glass" role="toolbar" aria-label="Viewer controls">
            <button id="resetBtn" class="icon-btn" title="Reset view" aria-label="Reset view">Reset</button>
            <button id="hotspotToggleBtn" class="icon-btn" title="Toggle hotspots" aria-label="Toggle hotspots">Hotspots</button>
            <button id="tourBtn" class="icon-btn" title="Start guided tour" aria-label="Start guided tour">Start Tour</button>
            <button id="compareBtn" class="icon-btn" title="Toggle compare mode" aria-label="Toggle compare mode">Compare</button>
            <button id="syncBtn" class="icon-btn" title="Toggle compare sync" aria-label="Toggle compare sync" hidden>Sync On</button>
            <button id="fullscreenBtn" class="icon-btn" title="Fullscreen" aria-label="Fullscreen">Fullscreen</button>
            <button id="shareBtn" class="icon-btn" title="Copy share link" aria-label="Copy share link">Share</button>
          </div>
        </header>

        <section class="meta-row">
          <p id="artifactHook" class="artifact-hook"></p>
          <div class="meta-actions">
            <button id="listToggleBtn" class="chip-btn" aria-controls="hotspotListPanel">Inspect</button>
            <button id="storyToggleBtn" class="chip-btn" aria-controls="storyPanel">Story</button>
          </div>
        </section>

        <aside id="hotspotListPanel" class="hotspot-panel glass" aria-label="Hotspot list"></aside>

        <aside id="storyPanel" class="story-panel glass" aria-label="Artifact story" hidden>
          <p id="storyKicker" class="panel-label"></p>
          <h2 id="storyTitle" class="story-title"></h2>
          <p id="storySummary" class="story-summary"></p>
          <div id="storyBody" class="story-body"></div>
          <div id="storyReferences" class="story-references"></div>
        </aside>

        <article id="hotspotCard" class="hotspot-card glass" aria-live="polite" hidden>
          <p id="hotspotKicker" class="hotspot-kicker"></p>
          <h2 id="hotspotTitle" class="hotspot-title"></h2>
          <p id="hotspotBody" class="hotspot-body"></p>
          <a id="hotspotLink" class="hotspot-link" href="#" target="_blank" rel="noreferrer noopener" hidden>Reference</a>
          <div id="tourStepper" class="tour-stepper" hidden>
            <button id="prevStepBtn" class="chip-btn" aria-label="Previous tour step">Previous</button>
            <p id="tourProgress" class="tour-progress"></p>
            <button id="nextStepBtn" class="chip-btn" aria-label="Next tour step">Next</button>
          </div>
        </article>

        <aside id="compareHud" class="compare-hud glass" hidden>
          <p class="panel-label">Compare Against</p>
          <div id="compareArtifactList" class="compare-list"></div>
        </aside>

        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
